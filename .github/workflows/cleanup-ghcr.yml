name: cleanup-ghcr

# Destructive release maintenance is intentionally isolated from Release.
# The consolidated E2E workflow dispatches it only after every released-
# artifact job succeeds, so the CLI upgrade leg can use the previous release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "validated release tag (defaults to latest)"
        required: false
        type: string

concurrency:
  group: cleanup-ghcr
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  prune:
    name: prune old release state
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v4

      - name: prune everything outside the current latest manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG_OWNER: Harsh-2002
          PKG_NAME: orva
        run: |
          set -eu

          docker buildx imagetools inspect \
            "ghcr.io/${PKG_OWNER}/${PKG_NAME}:latest" --raw \
            | jq -r '..|.digest? // empty' \
            | sort -u > /tmp/keep_digests.txt
          test -s /tmp/keep_digests.txt || {
            echo "::error::could not resolve the current :latest manifest tree"
            exit 1
          }

          gh api -H 'Accept: application/vnd.github+json' \
            "/users/${PKG_OWNER}/packages/container/${PKG_NAME}/versions?per_page=100" \
            --paginate \
            --jq '.[] | "\(.id)|\(.name)|\((.metadata.container.tags // []) | join(","))"' \
            > /tmp/versions.txt

          total=$(wc -l < /tmp/versions.txt)
          deleted=0
          kept=0
          while IFS='|' read -r id digest tags; do
            keep_reason=""
            if echo ",$tags," | grep -q ',latest,'; then
              keep_reason="latest"
            elif grep -qx "$digest" /tmp/keep_digests.txt; then
              keep_reason="current manifest tree"
            elif [ -z "$tags" ]; then
              # Attestations and per-architecture manifests may be untagged.
              # Preserve them unless GitHub exposes a reliable parent edge.
              keep_reason="untagged dependency"
            fi

            if [ -n "$keep_reason" ]; then
              echo "keep id=$id tags=$tags ($keep_reason)"
              kept=$((kept + 1))
              continue
            fi

            echo "delete id=$id tags=$tags"
            gh api --method DELETE \
              -H 'Accept: application/vnd.github+json' \
              "/users/${PKG_OWNER}/packages/container/${PKG_NAME}/versions/${id}"
            deleted=$((deleted + 1))
          done < /tmp/versions.txt

          {
            echo "## GHCR cleanup"
            echo ""
            echo "- kept: $kept"
            echo "- deleted: $deleted"
            echo "- inspected: $total"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: enforce one active GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -eu

          current_tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
          if [ -n "$DISPATCH_TAG" ] && [ "$DISPATCH_TAG" != "$current_tag" ]; then
            echo "::error::artifact E2E tag $DISPATCH_TAG is not the latest release $current_tag"
            exit 1
          fi

          deleted=0
          while IFS='|' read -r release_id release_tag; do
            [ -n "$release_id" ] || continue
            [ "$release_tag" = "$current_tag" ] && continue
            echo "delete release $release_tag (id=$release_id)"
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${release_tag}" \
              || echo "::warning::release $release_tag was deleted but its tag was already absent"
            deleted=$((deleted + 1))
          done < <(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.draft == false) | "\(.id)|\(.tag_name)"')

          {
            echo "## GitHub release cleanup"
            echo ""
            echo "- active release: $current_tag"
            echo "- previous releases deleted: $deleted"
          } >> "$GITHUB_STEP_SUMMARY"
