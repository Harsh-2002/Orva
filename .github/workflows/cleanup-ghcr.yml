name: cleanup-ghcr

# Destructive registry maintenance is intentionally isolated from Release.
# It runs only after Release completes successfully, so it cannot race an
# in-progress multi-arch manifest publication. Operators can also run it now.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: cleanup-ghcr
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  prune:
    name: prune old GHCR versions
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v4

      - name: prune everything outside the current latest manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG_OWNER: Harsh-2002
          PKG_NAME: orva
        run: |
          set -eu

          docker buildx imagetools inspect \
            "ghcr.io/${PKG_OWNER}/${PKG_NAME}:latest" --raw \
            | jq -r '..|.digest? // empty' \
            | sort -u > /tmp/keep_digests.txt
          test -s /tmp/keep_digests.txt || {
            echo "::error::could not resolve the current :latest manifest tree"
            exit 1
          }

          gh api -H 'Accept: application/vnd.github+json' \
            "/users/${PKG_OWNER}/packages/container/${PKG_NAME}/versions?per_page=100" \
            --paginate \
            --jq '.[] | "\(.id)|\(.name)|\((.metadata.container.tags // []) | join(","))"' \
            > /tmp/versions.txt

          total=$(wc -l < /tmp/versions.txt)
          deleted=0
          kept=0
          while IFS='|' read -r id digest tags; do
            keep_reason=""
            if echo ",$tags," | grep -q ',latest,'; then
              keep_reason="latest"
            elif grep -qx "$digest" /tmp/keep_digests.txt; then
              keep_reason="current manifest tree"
            elif [ -z "$tags" ]; then
              # Attestations and per-architecture manifests may be untagged.
              # Preserve them unless GitHub exposes a reliable parent edge.
              keep_reason="untagged dependency"
            fi

            if [ -n "$keep_reason" ]; then
              echo "keep id=$id tags=$tags ($keep_reason)"
              kept=$((kept + 1))
              continue
            fi

            echo "delete id=$id tags=$tags"
            gh api --method DELETE \
              -H 'Accept: application/vnd.github+json' \
              "/users/${PKG_OWNER}/packages/container/${PKG_NAME}/versions/${id}"
            deleted=$((deleted + 1))
          done < /tmp/versions.txt

          {
            echo "## GHCR cleanup"
            echo ""
            echo "- kept: $kept"
            echo "- deleted: $deleted"
            echo "- inspected: $total"
          } >> "$GITHUB_STEP_SUMMARY"
