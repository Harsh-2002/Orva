name: Release

# Triggers on `v*` tag pushes. Produces:
#   - orva-linux-{amd64,arm64}       (Go binary, static)
#   - nsjail-linux-{amd64,arm64}     (built from source, stripped)
#   - rootfs-{node,python}-{amd64,arm64}.tar.zst
#                                    (extracted from official Docker slim
#                                    images + adapter pre-installed)
#   - checksums.txt                  (sha256 of every asset)
#   - ghcr.io/harsh-2002/orva:latest (multi-arch OCI image, amd64 + arm64)
#
# Versioning lives in the GitHub Release (binaries, installers, changelog).
# The Docker image carries exactly one tag, :latest; there is no per-version
# image tag. `docker pull ghcr.io/harsh-2002/orva:latest` resolves the right
# architecture automatically.
#
# All release assets are attached to the GitHub Release and linked from
# install.sh via https://github.com/Harsh-2002/Orva/releases/latest/download/...
#
# Manual trigger (workflow_dispatch) is reserved for retrying an exact stable
# date tag or for an explicitly forced emergency rebuild. It still checks out
# that tag; the dispatch branch/ref is never used as release source.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "stable date tag (vYYYY.MM.DD) — required for workflow_dispatch"
        required: true
      force:
        description: "skip the verification gate (emergency only)"
        type: boolean
        default: false

# Two release runs must never race while mutating :latest or release assets.
concurrency:
  group: orva-release-state
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/harsh-2002/orva
  NSJAIL_REF: 5ebcc30bef4af60d6e28f012dd8bf7b99b8b0acf
  # Docker's build action uploads .dockerbuild records by default. Release
  # outputs are already explicit below, so retaining those diagnostic records
  # only creates undeclared artifacts and can leak into a retried draft.
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  # ── 0. Gate — verify, don't re-test ──────────────────────────────────
  # The release pipeline does NOT run tests. All verification (shellcheck,
  # go vet/test/build, ui build, docker smoke, full E2E suites) already ran
  # on the PR and on the push to main via the consolidated CI workflow. This
  # job only CONFIRMS the tagged commit is green — a status lookup, not a
  # test run — so the release stays fast while a tag can still never ship
  # code whose tests failed. Every build job `needs: gate`. `workflow_dispatch`
  # with force=true is emergency-only.
  gate:
    name: gate (verify CI already passed)
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: resolve commit SHA for the tag
        id: sha
        if: ${{ github.event.inputs.force != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          [[ "$TAG" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]] || {
            echo "::error::release tag must use stable date format vYYYY.MM.DD"
            exit 1
          }
          # gh prints its error body on stdout, so a failed call is caught by SHA shape, not emptiness.
          deadline=$((SECONDS + 120))  # ~2 min cap
          while :; do
            SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha || true)"
            if [[ "$SHA" =~ ^[0-9a-f]{40,64}$ ]]; then break; fi
            [ $SECONDS -lt $deadline ] || { echo "::error::$TAG did not resolve to a commit SHA — see the gh errors above"; exit 1; }
            echo "… $TAG has not resolved to a commit yet — retrying"; sleep 10
          done
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "gating on commit $SHA"

      - name: require CI success on that commit
        if: ${{ github.event.inputs.force != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          # Confirm the tagged commit's verification is green — a status lookup,
          # not a test run. Poll until the workflow completes (handles tagging
          # right after the merge push), bounded so a stuck check can't hang the
          # release. CI is a single consolidated workflow: job-level path
          # filtering skips only its fast lint/go/ui/docker jobs internally for
          # docs-only commits, so the workflow run itself always exists for a
          # push to main and its overall conclusion reflects only the jobs that
          # actually ran — one hard check on ci.yml suffices.
          check() {
            local wf="$1" mode="$2" deadline=$((SECONDS + 1200))  # ~20 min cap
            while :; do
              # gh prints its error body on stdout, so an unreadable status must be caught by shape.
              read -r status conclusion < <(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/runs?head_sha=${SHA}&event=push&branch=main&per_page=1" \
                --jq '.workflow_runs[0] | "\(.status) \(.conclusion)"' || echo "api_error null")
              case "$status" in
                null|queued|in_progress|requested|waiting|pending|completed) ;;
                *) [ $SECONDS -lt $deadline ] || { echo "::error::could not read $wf status for $SHA — see the gh errors above"; return 1; }
                   echo "… $wf status for $SHA is unreadable — retrying"; sleep 20; continue ;;
              esac
              if [ "$status" = "null" ]; then
                if [ "$mode" = "soft" ]; then echo "• $wf: no run for $SHA (path-filtered) — skipping"; return 0; fi
                echo "::error::no $wf run for $SHA — commit was not verified (use force=true to override)"; return 1
              fi
              if [ "$status" = "completed" ]; then
                [ "$conclusion" = "success" ] && { echo "✓ $wf succeeded for $SHA"; return 0; }
                echo "::error::$wf for $SHA concluded '$conclusion' — refusing to release an unverified commit"; return 1
              fi
              [ $SECONDS -lt $deadline ] || { echo "::error::timed out waiting for $wf on $SHA"; return 1; }
              echo "… $wf is '$status' for $SHA — waiting"; sleep 20
            done
          }
          check ci.yml hard
          echo "gate passed: verification is green for $SHA"

  # ── 1. Go binary: matrix amd64 + arm64 ───────────────────────────────
  build-orva:
    name: build orva (${{ matrix.goarch }})
    needs: gate
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          # Published binaries must not carry a stdlib CVE already fixed upstream.
          check-latest: true
          # No build cache — every release builds from scratch so we
          # can't accidentally ship a stale toolchain artifact.
          cache: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          # No npm cache — fresh install on every run.
          cache: ""

      - name: build ui
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: embed ui + adapters
        run: |
          rm -rf backend/internal/server/ui_dist
          cp -r frontend/dist backend/internal/server/ui_dist
          make adapters-embed

      - name: resolve build identity
        id: v
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi
          echo "commit=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: go build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build \
            -trimpath \
            -ldflags="-s -w \
              -X github.com/Harsh-2002/Orva/backend/internal/version.Version=${{ steps.v.outputs.tag }} \
              -X github.com/Harsh-2002/Orva/backend/internal/version.Commit=${{ steps.v.outputs.commit }} \
              -X github.com/Harsh-2002/Orva/backend/internal/version.BuildTime=${{ steps.v.outputs.build_time }}" \
            -o dist/orva-linux-${{ matrix.goarch }} \
            ./backend/cmd/orva

      - name: upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: orva-${{ matrix.goarch }}
          path: dist/orva-linux-${{ matrix.goarch }}
          if-no-files-found: error
          retention-days: 1

  # ── 1b. Standalone CLI binaries (Linux + macOS + Windows × amd64/arm64) ──
  # Slim CLI built from the dedicated ./cli/cmd/orva entry point — no
  # server packages, no embedded UI/adapters/docs/MCP. Cross-compiled
  # from a single ubuntu runner: pure Go, CGO disabled, fully static.
  # Windows builds get the .exe suffix.
  build-cli:
    name: build orva-cli (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: gate
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: ".exe"
          - goos: windows
            goarch: arm64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          # Published binaries must not carry a stdlib CVE already fixed upstream.
          check-latest: true
          # No build cache — every release builds from scratch so we
          # can't accidentally ship a stale toolchain artifact.
          cache: false

      - name: resolve build identity
        id: v
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi
          echo "commit=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: go build (slim cli)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          OUT="dist/orva-cli-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          # Slim CLI imports only cli/commands — main.Version is the right
          # ldflags target here (it forwards into commands.Version).
          go build \
            -trimpath \
            -ldflags="-s -w -X main.Version=${{ steps.v.outputs.tag }}" \
            -o "$OUT" \
            ./cli/cmd/orva
          file "$OUT" || true
          ls -lh "$OUT"

      - name: upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: orva-cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/orva-cli-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 1

  # ── 2. nsjail: per-arch standalone binary (release asset only) ───────
  # The container image's nsjail comes from inside the unified Dockerfile
  # (its `FROM debian:bookworm-slim AS nsjail` stage), so this job is
  # solely for producing the standalone `nsjail-linux-{amd64,arm64}`
  # binary that ships as a GitHub release asset for bare-metal installs.
  #
  # Why container: debian:bookworm-slim
  # ───────────────────────────────────
  # nsjail is a C++ binary that dynamically links against libprotobuf,
  # libnl-route-3, libstdc++, libcap, libc. Built on the ubuntu-24.04
  # host runner (glibc 2.39 / libstdc++ 14 / GLIBCXX_3.4.32+), the
  # binary carries symbol references too new for the bookworm-class
  # runtime its install.sh seeds it into — at which point dynamic
  # linking aborts at exec with
  #   "libprotobuf.so.32: cannot open shared object file"
  # then, after that lib is added,
  #   "version `GLIBC_2.38' not found"
  # Building inside debian:bookworm-slim matches the binary's symbol
  # references to the install target on every supported kernel
  # (Linux ≥ 3.2, which covers every system anyone deploys this on).
  build-nsjail:
    name: build nsjail (${{ matrix.goarch }})
    needs: gate
    runs-on: ${{ matrix.runner }}
    container: debian:bookworm-slim
    strategy:
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-24.04
          - goarch: arm64
            runner: ubuntu-24.04-arm
    steps:
      # No actions/checkout: the job clones nsjail upstream and produces
      # one binary; no Orva repo files are read here.

      - name: install build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git make gcc g++ autoconf bison flex libtool pkg-config \
            libprotobuf-dev libnl-route-3-dev protobuf-compiler

      - name: build nsjail from source
        run: |
          git clone --filter=blob:none https://github.com/google/nsjail.git /tmp/nsjail
          git -C /tmp/nsjail checkout "$NSJAIL_REF"
          cd /tmp/nsjail
          make -j"$(nproc)"
          strip nsjail
          file ./nsjail
          # Confirm the binary's NEEDED dyn deps match what the runtime
          # apt list installs (libprotobuf32, libnl-route-3-200,
          # libcap2-bin, libstdc++6, libc6). If a future libprotobuf
          # bookworm bump renames the .so version, this readlink + dump
          # output will surface in the workflow log immediately.
          objdump -p ./nsjail | grep NEEDED || true
          cp ./nsjail nsjail-linux-${{ matrix.goarch }}

      - name: upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: nsjail-${{ matrix.goarch }}
          path: /tmp/nsjail/nsjail-linux-${{ matrix.goarch }}
          if-no-files-found: error
          retention-days: 1

  # ── 3. Language rootfs tarballs ───────────────────────────────────────
  build-rootfs:
    name: rootfs ${{ matrix.runtime }} (${{ matrix.goarch }})
    needs: gate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, python]
        goarch: [amd64, arm64]
        include:
          - goarch: amd64
            runner: ubuntu-24.04
          - goarch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: install zstd
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zstd

      - name: extract rootfs via docker export
        run: |
          set -euo pipefail
          bash scripts/build-rootfs.sh "$GITHUB_WORKSPACE/rootfs" "${{ matrix.runtime }}"

          # Pre-install the adapter so install.sh doesn't need the source tree.
          mkdir -p "$GITHUB_WORKSPACE/rootfs/opt/orva"
          if [ -f "backend/runtimes/${{ matrix.runtime }}/adapter.js" ]; then
            cp "backend/runtimes/${{ matrix.runtime }}/adapter.js" "$GITHUB_WORKSPACE/rootfs/opt/orva/adapter.js"
          fi
          if [ -f "backend/runtimes/${{ matrix.runtime }}/adapter.py" ]; then
            cp "backend/runtimes/${{ matrix.runtime }}/adapter.py" "$GITHUB_WORKSPACE/rootfs/opt/orva/adapter.py"
          fi

      - name: tar + zstd compress
        run: |
          cd "$GITHUB_WORKSPACE/rootfs"
          tar -cf - . | zstd -19 -T0 -o "$GITHUB_WORKSPACE/rootfs-${{ matrix.runtime }}-${{ matrix.goarch }}.tar.zst"
          ls -lh "$GITHUB_WORKSPACE/rootfs-${{ matrix.runtime }}-${{ matrix.goarch }}.tar.zst"

      - name: upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rootfs-${{ matrix.runtime }}-${{ matrix.goarch }}
          path: rootfs-${{ matrix.runtime }}-${{ matrix.goarch }}.tar.zst
          if-no-files-found: error
          retention-days: 1

  # ── 4. Collate + compute checksums + publish GitHub Release ───────────
  release:
    name: publish github release
    # Do not publish a GitHub Release until the multi-arch image is live.
    # Installers resolve the newest published release, so publishing early
    # would expose a partially shipped version.
    needs: [build-orva, build-cli, build-nsjail, build-rootfs, docker-manifest]
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: resolve version
        id: v
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "!*.dockerbuild"
          path: artifacts

      - name: flatten + chmod
        run: |
          set -euo pipefail
          mkdir -p dist

          # download-artifact also retrieves the digest-* coordination
          # artifacts produced by the Docker jobs. Those are intentionally
          # zero-byte files whose names encode image digests; flattening every
          # artifact would make action-gh-release try to publish them and the
          # GitHub API rejects zero-byte release assets. Copy only the public
          # release contract, and require exactly one non-empty source for each
          # asset so missing/duplicate build output fails closed.
          expected=(
            orva-linux-amd64
            orva-linux-arm64
            orva-cli-linux-amd64
            orva-cli-linux-arm64
            orva-cli-darwin-amd64
            orva-cli-darwin-arm64
            orva-cli-windows-amd64.exe
            orva-cli-windows-arm64.exe
            nsjail-linux-amd64
            nsjail-linux-arm64
            rootfs-node-amd64.tar.zst
            rootfs-node-arm64.tar.zst
            rootfs-python-amd64.tar.zst
            rootfs-python-arm64.tar.zst
          )
          for asset in "${expected[@]}"; do
            mapfile -t matches < <(find artifacts -type f -name "$asset" -print)
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "::error::expected exactly one $asset artifact, found ${#matches[@]}"
              exit 1
            fi
            [ -s "${matches[0]}" ] || { echo "::error::$asset is empty"; exit 1; }
            cp -v "${matches[0]}" "dist/$asset"
          done

          for installer in install.sh install-cli.sh install-cli.ps1; do
            [ -s "scripts/$installer" ] || { echo "::error::$installer is empty"; exit 1; }
            cp -v "scripts/$installer" "dist/$installer"
          done

          if find dist -type f -size 0 -print -quit | grep -q .; then
            echo "::error::release staging contains a zero-byte file"
            exit 1
          fi
          # Mark every Unix-style binary executable. Windows .exe doesn't
          # need a chmod but the no-op is harmless.
          chmod +x dist/orva-linux-* dist/nsjail-linux-* 2>/dev/null || true
          for f in dist/orva-cli-*; do
            case "$f" in *.exe) ;; *) chmod +x "$f" 2>/dev/null || true ;; esac
          done
          ls -lh dist/

      - name: sha256 checksums
        working-directory: dist
        run: |
          sha256sum -- * | tee checksums.txt

      - name: create / update github release
        id: publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Orva ${{ steps.v.outputs.tag }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/*
          body: |
            ## Orva ${{ steps.v.outputs.tag }}

            ### Install

            **Docker:**
            ```
            docker run -d --name orva --restart unless-stopped \
              -p 8443:8443 --pid=host \
              --cap-add SYS_ADMIN \
              --security-opt seccomp=unconfined \
              --cgroupns=host --device /dev/net/tun \
              -v orva-data:/var/lib/orva \
              -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
              ghcr.io/harsh-2002/orva:latest
            ```

            **Bare Linux server (POSIX installer works on Debian/Ubuntu/Fedora/Alpine/Arch/openSUSE):**
            ```
            curl -fsSL https://github.com/Harsh-2002/Orva/releases/download/${{ steps.v.outputs.tag }}/install.sh | sh
            ```

            **Standalone CLI (Linux + macOS):**
            ```
            curl -fsSL https://github.com/Harsh-2002/Orva/releases/download/${{ steps.v.outputs.tag }}/install-cli.sh | sh
            ```

            **Standalone CLI (Windows, PowerShell):**
            ```
            irm https://github.com/Harsh-2002/Orva/releases/download/${{ steps.v.outputs.tag }}/install-cli.ps1 | iex
            ```

            ### Release assets

            | asset | description |
            |---|---|
            | `orva-linux-amd64`, `orva-linux-arm64` | Daemon + CLI binary (server install via `install.sh`) |
            | `orva-cli-linux-{amd64,arm64}` | Slim CLI (Linux) — used by `install-cli.sh` |
            | `orva-cli-darwin-{amd64,arm64}` | Slim CLI (macOS Intel + Apple Silicon) |
            | `orva-cli-windows-{amd64,arm64}.exe` | Slim CLI (Windows) — used by `install-cli.ps1` |
            | `nsjail-linux-{amd64,arm64}` | Pre-built nsjail (downloaded by install.sh) |
            | `rootfs-{node,python}-{amd64,arm64}.tar.zst` | Language rootfs |
            | `install.sh`, `install-cli.sh`, `install-cli.ps1` | One-line installers |
            | `checksums.txt` | SHA-256 of every other asset above |

      - name: enforce release asset contract
        if: ${{ always() && steps.publish.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          declare -A allowed
          for asset in \
            orva-linux-amd64 orva-linux-arm64 \
            orva-cli-linux-amd64 orva-cli-linux-arm64 \
            orva-cli-darwin-amd64 orva-cli-darwin-arm64 \
            orva-cli-windows-amd64.exe orva-cli-windows-arm64.exe \
            nsjail-linux-amd64 nsjail-linux-arm64 \
            rootfs-node-amd64.tar.zst rootfs-node-arm64.tar.zst \
            rootfs-python-amd64.tar.zst rootfs-python-arm64.tar.zst \
            install.sh install-cli.sh install-cli.ps1 checksums.txt; do
            allowed["$asset"]=1
          done

          # The release is guaranteed to be resolvable after action-gh-release.
          # Remove undeclared leftovers from failed/retried drafts, then require
          # the final public contract to contain exactly 18 non-empty assets.
          release_id=$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            --jq '.id')
          while IFS=$'\t' read -r asset_id asset_name; do
            [ -n "$asset_id" ] || continue
            if [ -z "${allowed[$asset_name]+x}" ]; then
              echo "removing stale release asset: $asset_name"
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            fi
          done < <(gh api \
            --paginate \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
            --jq '.[] | "\(.id)\t\(.name)"')

          mapfile -t published < <(gh api \
            --paginate \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
            --jq '.[] | "\(.name)\t\(.size)"')
          [ "${#published[@]}" -eq 18 ] || {
            echo "::error::expected 18 release assets, found ${#published[@]}"
            exit 1
          }
          for entry in "${published[@]}"; do
            IFS=$'\t' read -r asset_name asset_size <<< "$entry"
            [ -n "${allowed[$asset_name]+x}" ] || {
              echo "::error::unexpected release asset remains: $asset_name"
              exit 1
            }
            [ "$asset_size" -gt 0 ] || {
              echo "::error::release asset is empty: $asset_name"
              exit 1
            }
          done

      # Releases created with GITHUB_TOKEN do not emit downstream release
      # events. Dispatch the consolidated artifact suite explicitly.
      - name: dispatch released-artifact E2E
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.v.outputs.tag }}
        run: |
          gh workflow run ci.yml --ref "$RELEASE_TAG" \
            -f suite=artifacts \
            -f tag="$RELEASE_TAG"

  # ── 5. Per-arch Docker image, native runners (no QEMU) ────────────────
  # Single source of truth: the unified Dockerfile builds UI, Go binary,
  # nsjail, and rootfs stages itself, all in matched debian:bookworm-slim
  # environments. No artifact staging from sibling jobs; no second
  # Dockerfile to drift. Each arch builds on its native runner so QEMU
  # emulation stays out of the loop (UI + npm install was the original
  # reason for splitting builds; native runners removed that pressure).
  #
  # Each arch pushes by digest only; the manifest job below stitches the
  # two digests into the single public `:latest` tag.
  docker-image:
    name: docker image (${{ matrix.goarch }})
    needs: gate
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - goarch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    outputs:
      digest_amd64: ${{ steps.digest_out.outputs.amd64 }}
      digest_arm64: ${{ steps.digest_out.outputs.arm64 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: resolve build identity
        id: v
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi
          echo "commit=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push by digest only — no tag is created. The manifest job below
      # references the per-arch digests directly when stitching them
      # into the multi-arch :latest + :${tag} tags.
      - name: build + push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          # No layer cache — `no-cache: true` forces every layer to
          # rebuild, and `pull: true` re-pulls every base image. The
          # release pipeline must produce bit-identical-from-scratch
          # output every time; cached layers can mask supply-chain
          # surprises (a base image gets repinned but our cache still
          # has the old one).
          no-cache: true
          pull: true
          labels: |
            org.opencontainers.image.title=Orva
            org.opencontainers.image.source=https://github.com/Harsh-2002/Orva
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ steps.v.outputs.tag }}
            org.opencontainers.image.revision=${{ steps.v.outputs.commit }}
            org.opencontainers.image.created=${{ steps.v.outputs.build_time }}
          build-args: |
            VERSION=${{ steps.v.outputs.tag }}
            COMMIT=${{ steps.v.outputs.commit }}
            BUILD_TIME=${{ steps.v.outputs.build_time }}
            IMAGE_REF=${{ env.IMAGE_NAME }}:latest
            NSJAIL_REF=${{ env.NSJAIL_REF }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: export digest for manifest job
        id: digest_out
        run: |
          digest="${{ steps.build.outputs.digest }}"
          echo "${{ matrix.goarch }}=${digest}" >> "$GITHUB_OUTPUT"
          echo "digest_${{ matrix.goarch }}=${digest}" >> "$GITHUB_OUTPUT"
          echo "::notice::pushed ${{ matrix.goarch }} → ${digest}"

      - name: write digest to artifact
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.goarch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── 6. Stitch the two per-arch digests into multi-arch manifest ──────
  # The Docker image carries exactly ONE tag: `:latest`. It is a multi-arch
  # manifest (linux/amd64 + linux/arm64); `docker pull` resolves the right
  # arch automatically. Versioning lives in the GitHub Release (binaries,
  # installers, changelog), NOT in image tags — we intentionally do not push
  # a per-version `:vYYYY.MM.DD` image tag.
  docker-manifest:
    name: docker multi-arch manifest
    needs: [docker-image]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      packages: write
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - name: resolve version
        id: v
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: create + push multi-arch manifest (:latest only)
        run: |
          cd /tmp/digests
          mapfile -t digests < <(printf '${{ env.IMAGE_NAME }}@sha256:%s\n' *)
          docker buildx imagetools create \
            -t ${{ env.IMAGE_NAME }}:latest \
            "${digests[@]}"

      - name: inspect
        run: |
          docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:latest

  # ── 7. Purge this run's build intermediates ──────────────────────────
  # Release is the only workflow allowed to upload artifacts, and it does so
  # purely to hand binaries between build jobs — every one of them is also
  # published as a release asset, so retaining them just burns storage for
  # `retention-days`. Delete them as soon as the release + manifest are live
  # so no run leaves downloadable artifacts behind. Runs last and never fails
  # the release: the artifacts are disposable, so a cleanup hiccup must not
  # mark an otherwise-good release red.
  purge-build-artifacts:
    name: purge build artifacts
    needs: [release, docker-manifest]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: delete every artifact produced by this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          ids=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[].id' || true)
          if [ -z "$ids" ]; then
            echo "no artifacts to purge"
            exit 0
          fi
          deleted=0
          failed=0
          for id in $ids; do
            if gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" >/dev/null 2>&1; then
              deleted=$((deleted + 1))
            else
              echo "::warning::could not delete artifact $id"
              failed=$((failed + 1))
            fi
          done
          echo "purged $deleted artifact(s), $failed failure(s)"
          {
            echo "## Build artifact purge"
            echo ""
            echo "- deleted: $deleted"
            echo "- failed:  $failed"
          } >> "$GITHUB_STEP_SUMMARY"
