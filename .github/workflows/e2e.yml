# Comprehensive programmatic E2E suite (test/e2e). Builds Orva, runs it, and
# drives every domain + the CLI + the AI agentic loop (via a mock LLM — no real
# provider key needed). Orva runs directly on the hosted VM (not inside a
# nested container), with nsjail and both runtime rootfs trees provisioned so
# deploy + real sandbox invocation are mandatory parts of the gate.
name: e2e

# Least-privilege default token (these jobs only read the repo).
permissions:
  contents: read

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Build orva (server + CLI)
        run: make build

      - name: Provision nsjail
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git make gcc g++ autoconf bison flex libtool pkg-config \
            libcap-dev libcap2-bin libprotobuf-dev libnl-route-3-dev protobuf-compiler
          git clone --filter=blob:none https://github.com/google/nsjail.git "$RUNNER_TEMP/nsjail-src"
          git -C "$RUNNER_TEMP/nsjail-src" checkout 5ebcc30bef4af60d6e28f012dd8bf7b99b8b0acf
          make -C "$RUNNER_TEMP/nsjail-src" -j"$(nproc)"
          sudo install -m 0755 "$RUNNER_TEMP/nsjail-src/nsjail" /usr/local/bin/nsjail
          sudo setcap cap_sys_admin,cap_setuid,cap_setgid,cap_net_admin,cap_net_bind_service=eip \
            /usr/local/bin/nsjail
          getcap /usr/local/bin/nsjail

      - name: Provision runtime rootfs trees
        run: |
          mkdir -p "$RUNNER_TEMP/orva-data/rootfs"
          bash scripts/build-rootfs.sh "$RUNNER_TEMP/orva-data/rootfs/node" node
          bash scripts/build-rootfs.sh "$RUNNER_TEMP/orva-data/rootfs/python" python
          ./build/orva setup --data-dir "$RUNNER_TEMP/orva-data"

      - name: Start Orva
        run: |
          mkdir -p "$RUNNER_TEMP/orva-data"
          ORVA_DATA_DIR="$RUNNER_TEMP/orva-data" ./build/orva serve > "$RUNNER_TEMP/orva.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/orva.pid"
          # Wait for health (the API/DB come up without nsjail).
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8443/api/v1/system/health >/dev/null 2>&1; then
              echo "orva healthy"; break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8443/api/v1/system/health || (cat "$RUNNER_TEMP/orva.log"; exit 1)

      - name: Run E2E suite
        env:
          ORVA_REQUIRE_SANDBOX: "1"
        run: |
          ADMIN_KEY="$(cat "$RUNNER_TEMP/orva-data/.admin-key")"
          python3 test/e2e/run.py --url http://127.0.0.1:8443 --api-key "$ADMIN_KEY"

      - name: Stop Orva
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/orva.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/orva.pid")" 2>/dev/null || true
          fi

      - name: Show checklist
        if: always()
        run: cat test/e2e/CHECKLIST.md || true

      - name: Annotate E2E failures
        if: failure()
        run: |
          audit_summary=$(grep -E '^\- \*\*(Modules|Checks)|\| .* \| ❌ FAIL' test/e2e/CHECKLIST.md | paste -sd ' ' -)
          echo "::error title=E2E checklist::$audit_summary"

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: orva-e2e-diagnostics
          path: |
            ${{ runner.temp }}/orva.log
            test/e2e/CHECKLIST.md
          if-no-files-found: ignore
