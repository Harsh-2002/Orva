name: install-e2e

# Real install + smoke + uninstall across 6 distros, in privileged
# systemd-in-docker containers. The cheap stuff (shellcheck on the
# install scripts themselves) lives in ci.yml — this workflow assumes
# the scripts pass lint and focuses on actually running them.

# Least-privilege default token (these jobs only read the repo).
permissions:
  contents: read

on:
  # These jobs download released binaries, so they do not run on main-push.
  # External/manual publications can trigger release:published; releases made
  # by release.yml with GITHUB_TOKEN are dispatched explicitly with their tag.
  release:
    types: [published]
  pull_request:
    paths:
      - "scripts/install.sh"
      - "scripts/uninstall.sh"
      - "test/install/**"
      - ".github/workflows/install-e2e.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag to validate (defaults to latest)"
        required: false
        type: string
  schedule:
    # Weekly Sunday 03:00 UTC catches rolling-release breakage (Arch).
    - cron: "0 3 * * 0"

jobs:
  matrix:
    runs-on: ubuntu-24.04
    # Two distros are advisory rather than gating:
    #   arch   — rolling release; pacman mirrors drift between runs and
    #            occasionally serve stale signatures or 404 individual
    #            versions, so a transient mirror flake shouldn't block.
    #   alpine — musl + glibc-built nsjail works via gcompat for the
    #            install + smoke flow, but openrc's reinstall edge case
    #            (uninstall then immediate reinstall + service start)
    #            occasionally races on the GH runner. Smoke flow proves
    #            the core install works; the reinstall round-trip is a
    #            nice-to-have we'll harden later.
    continue-on-error: ${{ matrix.distro == 'arch' || matrix.distro == 'alpine321' }}
    strategy:
      fail-fast: false
      matrix:
        distro:
          - ubuntu24
          - debian12
          - alpine321
          - rocky9
          - fedora41
          - arch
    steps:
      - uses: actions/checkout@v6

      - name: Install jq + curl
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq curl

      - name: Run install + smoke + uninstall for ${{ matrix.distro }}
        # ORVA_BROWSER_LEG=0 skips agent-browser in CI (no display).
        # HTTP route spot-checks still run.
        env:
          ORVA_BROWSER_LEG: "0"
          ORVA_VERSION: ${{ inputs.tag || github.event.release.tag_name }}
        run: bash test/install/run-distro.sh ${{ matrix.distro }}

      - name: Summarize ${{ matrix.distro }} result
        if: always()
        run: |
          result="not recorded"
          if compgen -G 'test/install/results-*.tsv' >/dev/null; then
            recorded=$(awk -F '\t' -v distro="${{ matrix.distro }}" '$1 == distro { value=$2 } END { print value }' test/install/results-*.tsv)
            [ -z "$recorded" ] || result="$recorded"
          fi
          {
            echo "## install-e2e: ${{ matrix.distro }}"
            echo ""
            echo "Result: **$result**"
            echo ""
            echo "Detailed output is available in this job's log."
          } >> "$GITHUB_STEP_SUMMARY"

  # gVisor (runsc) CI leg removed 2026-05-13 after end-to-end testing
  # confirmed Orva does not run under gVisor — nsjail's nested-namespace
  # clone() is rejected by gVisor's sentry on every invocation. See
  # docs/GVISOR.md for the full writeup.

  # Hosted runners are VMs, so this leg exercises the real systemd service
  # and makes both language engines mandatory. The distro matrix above still
  # covers installer portability inside privileged containers.
  native-engine:
    name: native systemd + Node/Python engine (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install jq
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends jq
      - name: Install and invoke both runtimes
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: sudo --preserve-env=RELEASE_TAG bash test/install/native-engine.sh
