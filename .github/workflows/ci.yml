name: CI

# Fast PR / push gate. Owns ALL shell linting for the repo so the heavier
# suites consolidated in e2e.yml don't re-lint the same scripts.
# Path-filtered: docs-only / screenshot-only commits skip CI entirely.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/screenshots/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/screenshots/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The Docker build action otherwise retains a .dockerbuild record. Validation
# output belongs in logs/check summaries; only Release may create artifacts.
env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  lint:
    name: workflow + shell lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: false

      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends dash shellcheck

      - name: GitHub Actions workflow syntax + embedded shell
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      # POSIX scripts (install.sh, install-cli.sh) MUST run under any POSIX sh
      # on user systems. dash -n catches bashisms that shellcheck -s sh would
      # also catch; running both keeps the gate tight. install.sh embeds the
      # systemd/OpenRC units + uninstall.sh as heredocs, so there is no
      # standalone uninstall.sh to lint here.
      - name: POSIX user-facing scripts
        run: |
          dash -n scripts/install.sh
          dash -n scripts/install-cli.sh
          dash -n test/release/download-verified-asset.sh
          shellcheck -s sh -S warning \
            scripts/install.sh \
            scripts/install-cli.sh \
            test/release/download-verified-asset.sh

      # bash scripts — entrypoint + every test suite. Failing builds here
      # gate the consolidated E2E workflow's installer and CLI jobs.
      - name: bash scripts
        run: |
          bash -n scripts/entrypoint.sh
          bash -n scripts/build-rootfs.sh
          shellcheck -S warning \
            scripts/entrypoint.sh \
            scripts/build-rootfs.sh \
            test/*.sh \
            test/install/*.sh \
            test/install/lib/*.sh \
            test/cli/*.sh \
            test/kata-bench/*.sh \
            test/cli/lib/*.sh

  go:
    name: go ${{ matrix.go }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        go: ["1.26.x"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          # No npm cache — every CI run starts from scratch so we
          # never pick up a stale lockfile or dependency tree.
          cache: ""

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          # No build cache for the same reason.
          cache: false

      - name: build ui + embed adapters
        # //go:embed all:ui_dist needs the dir populated before vet/test/
        # build. `make embed` does the npm ci + vite build + cp into
        # backend/internal/server/ui_dist.
        run: |
          make embed
          make adapters-embed

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -count=1 -race ./...

      - name: go build (server binary)
        run: |
          mkdir -p build
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags="-s -w \
              -X github.com/Harsh-2002/Orva/backend/internal/version.Version=ci-${GITHUB_SHA::7} \
              -X github.com/Harsh-2002/Orva/backend/internal/version.Commit=${GITHUB_SHA::7} \
              -X github.com/Harsh-2002/Orva/backend/internal/version.BuildTime=${BUILD_TIME}" \
            -o build/orva ./backend/cmd/orva
          ./build/orva --help >/dev/null
          ./build/orva --version | grep -F "ci-${GITHUB_SHA::7}"

  ui:
    name: ui build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: ""

      - name: npm ci
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: dependency audit (moderate+)
        working-directory: frontend
        run: npm audit --audit-level=moderate

      - name: eslint
        working-directory: frontend
        run: npm run lint

      - name: vite build
        working-directory: frontend
        run: npm run build

  docker:
    name: docker image smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: build image (no push, no cache)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: orva:ci
          no-cache: true
          pull: true

      - name: run container + health smoke
        run: |
          docker run -d --name orva-ci -p 127.0.0.1:18443:8443 orva:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18443/api/v1/system/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18443/api/v1/system/health
          curl -fsS http://127.0.0.1:18443/ >/dev/null

      - name: container logs
        if: always()
        run: |
          docker logs orva-ci 2>&1 || true
          docker rm -f orva-ci >/dev/null 2>&1 || true
