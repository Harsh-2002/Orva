name: CI
run-name: CI / ${{ inputs.suite || github.event_name }}

# Orva's single verification workflow. It owns everything that gates a merge
# or a release: fast lint/build/unit checks, plus the consolidated E2E
# suites — source API/sandbox, CLI cross-build + installers, and bare-metal
# server installers/native runtime. Release only ships commits already green
# here; it does not repeat any of this testing.
#
# Docs-only pushes/PRs skip only the fast lint/go/ui/docker jobs (via the
# `changes` job's `code` filter below) — every main push still runs the full
# source + CLI + installer gates so a later docs-only commit can never
# inherit unverified installer changes.

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      suite:
        description: "suite to run"
        required: true
        type: choice
        default: source
        options:
          - source
          - cli
          - install
          - artifacts
          - all
      tag:
        description: "release tag for artifact suites (defaults to latest)"
        required: false
        type: string
  schedule:
    - cron: "0 3 * * 0" # released server installers
    - cron: "0 4 * * 0" # released CLI installers

# Event name is part of the key: `schedule` and `push` both default
# `github.ref` to `refs/heads/main`, so without this a Sunday scheduled
# sweep and a same-day push would land in the same group and cancel
# each other.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

# The Docker build action otherwise retains a .dockerbuild record. Validation
# output belongs in logs/check summaries; only Release may create artifacts.
env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  # Path routing keeps expensive jobs scoped to the files they cover.
  # `code` reproduces the old ci.yml trigger-level paths-ignore (skip the
  # fast lint/go/ui/docker jobs for docs-only changes) now that a single
  # workflow file can't path-filter only some of its jobs at trigger level.
  # `cli`/`cli_installers`/`server_install` still route PR-only installer/CLI
  # jobs. Every main push still runs all source + installer gates regardless
  # of these outputs (see each job's `if:` below) — only PRs and the fast
  # jobs are path-routed.
  changes:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.code.outputs.code }}
      cli: ${{ steps.filter.outputs.cli }}
      cli_installers: ${{ steps.filter.outputs.cli_installers }}
      server_install: ${{ steps.filter.outputs.server_install }}
    steps:
      - uses: actions/checkout@v7
      # Separate step: 'code' needs the 'every' quantifier so its patterns
      # combine as pure exclusions (picomatch inverts each '!'-prefixed
      # pattern's own match, then 'every' ANDs them — a file counts as
      # 'code' only if it evades every exclusion). The filters below use
      # the default 'some' quantifier (any pattern match = included), which
      # 'every' would break.
      - uses: dorny/paths-filter@v4
        id: code
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '!**/*.md'
              - '!docs/screenshots/**'
              - '!LICENSE'
              - '!.github/ISSUE_TEMPLATE/**'
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            cli:
              - 'cli/**'
              - 'internal/client/**'
              - 'internal/ids/**'
              - 'scripts/install-cli.sh'
              - 'scripts/install-cli.ps1'
              - 'test/cli/**'
              - '.github/workflows/ci.yml'
            cli_installers:
              - 'scripts/install-cli.sh'
              - 'scripts/install-cli.ps1'
              - 'test/cli/install-cli-test.sh'
              - 'test/cli/upgrade-test.sh'
              - 'test/cli/lib/**'
              - 'test/release/**'
              - '.github/workflows/ci.yml'
            server_install:
              - 'scripts/install.sh'
              - 'test/install/**'
              - 'test/release/**'
              - '.github/workflows/ci.yml'

  # ── Fast lint/build/unit gate ──────────────────────────────────────────
  lint:
    name: workflow + shell lint
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'push' || github.event_name == 'pull_request') &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: false

      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends dash shellcheck

      - name: GitHub Actions workflow syntax + embedded shell
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      # POSIX scripts (install.sh, install-cli.sh) MUST run under any POSIX sh
      # on user systems. dash -n catches bashisms that shellcheck -s sh would
      # also catch; running both keeps the gate tight. install.sh embeds the
      # systemd/OpenRC units + uninstall.sh as heredocs, so there is no
      # standalone uninstall.sh to lint here.
      - name: POSIX user-facing scripts
        run: |
          dash -n scripts/install.sh
          dash -n scripts/install-cli.sh
          dash -n test/release/download-verified-asset.sh
          shellcheck -s sh -S warning \
            scripts/install.sh \
            scripts/install-cli.sh \
            test/release/download-verified-asset.sh

      # bash scripts — entrypoint + every test suite. Failing builds here
      # gate the consolidated E2E suites' installer and CLI jobs.
      - name: bash scripts
        run: |
          bash -n scripts/entrypoint.sh
          bash -n scripts/build-rootfs.sh
          shellcheck -S warning \
            scripts/entrypoint.sh \
            scripts/build-rootfs.sh \
            test/*.sh \
            test/install/*.sh \
            test/install/lib/*.sh \
            test/cli/*.sh \
            test/kata-bench/*.sh \
            test/cli/lib/*.sh

  go:
    name: go ${{ matrix.go }} / ${{ matrix.os }}
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'push' || github.event_name == 'pull_request') &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        go: ["1.26.x"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          # No npm cache — every CI run starts from scratch so we
          # never pick up a stale lockfile or dependency tree.
          cache: ""

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          # No build cache for the same reason.
          cache: false

      - name: build ui + embed adapters
        # //go:embed all:ui_dist needs the dir populated before vet/test/
        # build. `make embed` does the npm ci + vite build + cp into
        # backend/internal/server/ui_dist.
        run: |
          make embed
          make adapters-embed

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -count=1 -race ./...

      - name: go build (server binary)
        run: |
          mkdir -p build
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags="-s -w \
              -X github.com/Harsh-2002/Orva/backend/internal/version.Version=ci-${GITHUB_SHA::7} \
              -X github.com/Harsh-2002/Orva/backend/internal/version.Commit=${GITHUB_SHA::7} \
              -X github.com/Harsh-2002/Orva/backend/internal/version.BuildTime=${BUILD_TIME}" \
            -o build/orva ./backend/cmd/orva
          ./build/orva --help >/dev/null

      - name: govulncheck (Go vulnerability scan)
        # The Go analog of the ui job's `npm audit`: fail the build on a
        # call-reachable Go/stdlib vulnerability. Pinned like actionlint above —
        # never @latest. Default source mode keeps it low-noise (reachable only).
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
          ./build/orva --version | grep -F "ci-${GITHUB_SHA::7}"

  ui:
    name: ui build
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'push' || github.event_name == 'pull_request') &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: ""

      - name: npm ci
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: dependency audit (moderate+)
        working-directory: frontend
        run: npm audit --audit-level=moderate

      - name: eslint
        working-directory: frontend
        run: npm run lint

      - name: vite build
        working-directory: frontend
        run: npm run build

  docker:
    name: docker image smoke
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'push' || github.event_name == 'pull_request') &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: build image (no push, no cache)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: orva:ci
          no-cache: true
          pull: true

      - name: run container + health smoke
        run: |
          docker run -d --name orva-ci -p 127.0.0.1:18443:8443 orva:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18443/api/v1/system/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18443/api/v1/system/health
          curl -fsS http://127.0.0.1:18443/ >/dev/null

      - name: container logs
        if: always()
        run: |
          docker logs orva-ci 2>&1 || true
          docker rm -f orva-ci >/dev/null 2>&1 || true

  # ── Consolidated E2E suites ─────────────────────────────────────────────
  #   source  — build the current commit and exercise every API/CLI domain
  #   cli     — cross-build and validate released CLI installers/upgrades
  #   install — validate released server installers plus native sandboxes
  e2e:
    name: source API + sandbox E2E
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
        (inputs.suite == 'source' || inputs.suite == 'all'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: e2e-source-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Test E2E harness
        run: python3 -m unittest discover -s test/e2e/unit -p 'test_*.py'

      - name: Build orva (server + CLI)
        run: make build

      - name: Provision nsjail
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git make gcc g++ autoconf bison flex libtool pkg-config \
            libcap-dev libcap2-bin libprotobuf-dev libnl-route-3-dev protobuf-compiler
          git clone --filter=blob:none https://github.com/google/nsjail.git "$RUNNER_TEMP/nsjail-src"
          git -C "$RUNNER_TEMP/nsjail-src" checkout 5ebcc30bef4af60d6e28f012dd8bf7b99b8b0acf
          make -C "$RUNNER_TEMP/nsjail-src" -j"$(nproc)"
          sudo install -m 0755 "$RUNNER_TEMP/nsjail-src/nsjail" /usr/local/bin/nsjail
          sudo setcap cap_sys_admin,cap_setuid,cap_setgid,cap_net_admin,cap_net_bind_service=eip \
            /usr/local/bin/nsjail
          getcap /usr/local/bin/nsjail

      - name: Provision runtime rootfs trees
        run: |
          mkdir -p "$RUNNER_TEMP/orva-data/rootfs"
          bash scripts/build-rootfs.sh "$RUNNER_TEMP/orva-data/rootfs/node" node
          bash scripts/build-rootfs.sh "$RUNNER_TEMP/orva-data/rootfs/python" python
          ./build/orva setup --data-dir "$RUNNER_TEMP/orva-data"

      - name: Validate nsjail preflight
        run: |
          getcap /usr/local/bin/nsjail || true
          sysctl kernel.unprivileged_userns_clone 2>/dev/null || true
          sysctl kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true
          # Ubuntu 24.04 hosted runners restrict unprivileged user namespaces.
          # Exercise Orva's setcap fallback while keeping every other nsjail
          # namespace and the mandatory real invocation gate enabled.
          if ! preflight=$(nsjail -Mo --disable_clone_newuser --chroot "$RUNNER_TEMP/orva-data/rootfs/node" -- /usr/local/bin/node --version 2>&1); then
            preflight=${preflight//'%'/'%25'}
            preflight=${preflight//$'\r'/'%0D'}
            preflight=${preflight//$'\n'/'%0A'}
            echo "::error title=nsjail preflight::$preflight"
            exit 1
          fi
          echo "$preflight"

      - name: Start Orva
        run: |
          mkdir -p "$RUNNER_TEMP/orva-data"
          ORVA_DATA_DIR="$RUNNER_TEMP/orva-data" ORVA_DISABLE_USERNS=1 \
            ./build/orva serve > "$RUNNER_TEMP/orva.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/orva.pid"
          # Wait for health (the API/DB come up without nsjail).
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8443/api/v1/system/health >/dev/null 2>&1; then
              echo "orva healthy"; break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8443/api/v1/system/health || (cat "$RUNNER_TEMP/orva.log"; exit 1)

      - name: Run E2E suite
        id: suite
        env:
          ORVA_REQUIRE_SANDBOX: "1"
        run: |
          # Never let a tracked checklist from an earlier run impersonate the
          # diagnostics for a runner/process failure before aggregation.
          : > test/e2e/CHECKLIST.md
          ADMIN_KEY="$(cat "$RUNNER_TEMP/orva-data/.admin-key")"
          python3 test/e2e/run.py --url http://127.0.0.1:8443 --api-key "$ADMIN_KEY"

      - name: Stop Orva
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/orva.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/orva.pid")" 2>/dev/null || true
          fi

      - name: Show checklist
        if: always() && steps.suite.outcome != 'skipped'
        run: |
          cat test/e2e/CHECKLIST.md || true
          {
            echo "## E2E checklist"
            echo ""
            cat test/e2e/CHECKLIST.md
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Annotate E2E failures
        if: failure() && steps.suite.outcome == 'failure'
        run: |
          audit_summary=$(grep -E '^\- \*\*(Modules|Checks)|\| .* \| ❌ FAIL|^- .*test_.*: ' test/e2e/CHECKLIST.md | paste -sd ' ' - || true)
          [ -n "$audit_summary" ] || audit_summary="E2E process failed before writing its checklist; inspect the job log"
          audit_summary=${audit_summary//'%'/'%25'}
          echo "::error title=E2E checklist::$audit_summary"

  cli-unit:
    name: CLI unit tests
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        needs.changes.result == 'success' &&
        needs.changes.outputs.cli == 'true') ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.suite == 'cli' || inputs.suite == 'all')))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: false
      - name: go vet (cli + internal)
        run: go vet ./cli/... ./internal/...
      - name: go test ./cli/commands
        run: go test ./cli/commands/ -count=1 -v

  cli-cross-build:
    name: CLI cross-compile matrix
    needs: cli-unit
    # Do not inherit the PR-only `changes` job's skipped state through
    # cli-unit: run whenever the direct CLI unit-test gate actually passed.
    if: always() && needs.cli-unit.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: false
      - name: build matrix
        run: bash test/cli/build-matrix.sh
      - name: command-tree golden diff
        run: bash test/cli/command-tree.sh

  cli-install-linux:
    name: CLI installer (Linux/${{ matrix.arch }})
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        needs.changes.result == 'success' &&
        needs.changes.outputs.cli_installers == 'true') ||
       github.event_name == 'release' ||
       (github.event_name == 'schedule' && github.event.schedule == '0 4 * * 0') ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.suite == 'cli' || inputs.suite == 'artifacts' || inputs.suite == 'all')))
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ORVA_VERSION: ${{ inputs.tag || github.event.release.tag_name }}
      ORVA_CLI_TEST_IMAGE: ubuntu:24.04
      EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
      - name: install jq + curl
        run: sudo apt-get update -qq && sudo apt-get install -y jq curl
      - name: test release-asset verifier
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$RUNNER_TEMP/release-verifier/install-cli.sh"
          tag=$(sh test/release/download-verified-asset.sh install-cli.sh "$latest")
          test -n "$tag"
          test -s "$latest"
      - name: fetch exact released installer
        if: github.event_name == 'release' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          installer="$RUNNER_TEMP/release-assets/install-cli.sh"
          tag=$(sh test/release/download-verified-asset.sh install-cli.sh "$installer")
          echo "ORVA_VERSION=$tag" >> "$GITHUB_ENV"
          echo "ORVA_CLI_INSTALLER_PATH=$installer" >> "$GITHUB_ENV"
      - name: run install-cli-test.sh
        run: |
          case "$EXPECTED_ARCH:$(uname -m)" in
            amd64:x86_64|arm64:aarch64|arm64:arm64) ;;
            *) echo "unexpected runner architecture: $(uname -m) (wanted $EXPECTED_ARCH)" >&2; exit 1 ;;
          esac
          bash test/cli/install-cli-test.sh ubuntu24

  cli-install-macos:
    name: CLI installer (macOS/${{ matrix.arch }})
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        needs.changes.result == 'success' &&
        needs.changes.outputs.cli_installers == 'true') ||
       github.event_name == 'release' ||
       (github.event_name == 'schedule' && github.event.schedule == '0 4 * * 0') ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.suite == 'cli' || inputs.suite == 'artifacts' || inputs.suite == 'all')))
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: macos-26-intel
          - arch: arm64
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ORVA_VERSION: ${{ inputs.tag || github.event.release.tag_name }}
      EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
      - name: fetch exact released installer
        if: github.event_name == 'release' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          installer="$RUNNER_TEMP/release-assets/install-cli.sh"
          tag=$(sh test/release/download-verified-asset.sh install-cli.sh "$installer")
          echo "ORVA_VERSION=$tag" >> "$GITHUB_ENV"
          echo "ORVA_CLI_INSTALLER_PATH=$installer" >> "$GITHUB_ENV"
      - name: run installer against released artifact
        run: |
          case "$EXPECTED_ARCH:$(uname -m)" in
            amd64:x86_64|arm64:arm64) ;;
            *) echo "unexpected runner architecture: $(uname -m) (wanted $EXPECTED_ARCH)" >&2; exit 1 ;;
          esac
          mkdir -p /tmp/orva-test-bin
          export ORVA_CLI_PATH=/tmp/orva-test-bin/orva
          export ORVA_INSTALL_COMPLETION=0
          sh "${ORVA_CLI_INSTALLER_PATH:-scripts/install-cli.sh}"
          test -x /tmp/orva-test-bin/orva
          version_before=$(/tmp/orva-test-bin/orva --version)
          /tmp/orva-test-bin/orva completion zsh > /tmp/orva-test-bin/_orva
          test -s /tmp/orva-test-bin/_orva
          /tmp/orva-test-bin/orva upgrade --force
          version_after=$(/tmp/orva-test-bin/orva --version)
          test "$version_after" = "$version_before"
      - name: confirm slim CLI lacks serve
        run: |
          if /tmp/orva-test-bin/orva serve --help >/dev/null 2>&1; then
            echo "ERROR: slim CLI on macOS unexpectedly has 'serve' subcommand" >&2
            exit 1
          fi
          echo "OK: slim CLI on macOS correctly lacks 'serve'"

  cli-install-windows:
    name: CLI installer (Windows/${{ matrix.arch }})
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        needs.changes.result == 'success' &&
        needs.changes.outputs.cli_installers == 'true') ||
       github.event_name == 'release' ||
       (github.event_name == 'schedule' && github.event.schedule == '0 4 * * 0') ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.suite == 'cli' || inputs.suite == 'artifacts' || inputs.suite == 'all')))
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ORVA_VERSION: ${{ inputs.tag || github.event.release.tag_name }}
      EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
      - name: fetch exact released installer
        if: github.event_name == 'release' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:ORVA_VERSION
          if (-not $tag) {
            $tag = gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq .tagName
          }
          if (-not $tag) { throw "could not resolve release tag" }
          $dir = Join-Path $env:RUNNER_TEMP "release-assets"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          gh release download $tag --repo $env:GITHUB_REPOSITORY --dir $dir `
            --pattern install-cli.ps1 --pattern checksums.txt
          if ($LASTEXITCODE -ne 0) { throw "release asset download failed" }
          $installer = Join-Path $dir "install-cli.ps1"
          $checksums = Join-Path $dir "checksums.txt"
          $line = Get-Content $checksums | Where-Object { $_ -match '\s\*?install-cli\.ps1$' } | Select-Object -First 1
          if (-not $line) { throw "checksum entry missing for install-cli.ps1" }
          $want = ($line.Trim() -split '\s+')[0].ToLowerInvariant()
          $got = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($want -ne $got) { throw "checksum mismatch for install-cli.ps1" }
          "ORVA_VERSION=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ORVA_CLI_INSTALLER_PATH=$installer" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: run installer
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE.ToLowerInvariant() -ne $env:EXPECTED_ARCH) {
            throw "unexpected runner architecture: $env:PROCESSOR_ARCHITECTURE (wanted $env:EXPECTED_ARCH)"
          }
          $env:ORVA_CLI_DIR = "$env:RUNNER_TEMP\orva-test-bin"
          $env:ORVA_INSTALL_COMPLETION = "0"
          $installer = if ($env:ORVA_CLI_INSTALLER_PATH) { $env:ORVA_CLI_INSTALLER_PATH } else { "scripts/install-cli.ps1" }
          pwsh -NoProfile -File $installer
          if ($LASTEXITCODE -ne 0) { throw "install-cli.ps1 exited with code $LASTEXITCODE" }
          $exe = Join-Path $env:ORVA_CLI_DIR "orva.exe"
          if (-not (Test-Path $exe)) { throw "orva.exe not installed at $exe" }
          $versionBeforeUpgrade = & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "orva --version exited with code $LASTEXITCODE" }
          & $exe upgrade --force
          if ($LASTEXITCODE -ne 0) { throw "orva upgrade --force exited with code $LASTEXITCODE" }
          $versionAfterUpgrade = & $exe --version
          if ($LASTEXITCODE -ne 0 -or $versionAfterUpgrade -ne $versionBeforeUpgrade) {
            throw "post-upgrade version mismatch: before=$versionBeforeUpgrade after=$versionAfterUpgrade"
          }
          $serveOut = & $exe serve --help 2>&1
          if ($LASTEXITCODE -eq 0) {
            throw "slim CLI on Windows unexpectedly has 'serve' subcommand"
          }
          Write-Host "OK: slim CLI on Windows correctly lacks 'serve'"
          & $exe completion powershell | Out-File -FilePath "$env:RUNNER_TEMP\orva-completion.ps1"
          if ($LASTEXITCODE -ne 0) { throw "powershell completion generation failed" }
          if ((Get-Item "$env:RUNNER_TEMP\orva-completion.ps1").Length -lt 100) {
            throw "completion script too small — likely failed"
          }

  cli-upgrade:
    name: released CLI upgrade round-trip
    needs: cli-install-linux
    # cli-install-linux itself depends on the PR-only `changes` router and uses
    # always() so it can run for releases. Without an explicit status guard
    # here, GitHub propagates that skipped ancestor and silently skips this job
    # even after both Linux installer matrix legs succeed.
    if: >-
      always() &&
      needs.cli-install-linux.result == 'success' &&
      (github.event_name == 'release' ||
       (github.event_name == 'schedule' && github.event.schedule == '0 4 * * 0') ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.suite == 'cli' || inputs.suite == 'artifacts' || inputs.suite == 'all')))
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
      - name: install jq + curl
        run: sudo apt-get update -qq && sudo apt-get install -y jq curl
      - name: fetch exact released installer
        if: github.event_name == 'release' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          installer="$RUNNER_TEMP/release-assets/install-cli.sh"
          ORVA_VERSION="$RELEASE_TAG" sh test/release/download-verified-asset.sh install-cli.sh "$installer" >/dev/null
          echo "ORVA_CLI_INSTALLER_PATH=$installer" >> "$GITHUB_ENV"
      - name: run upgrade-test.sh
        run: bash test/cli/upgrade-test.sh

  install-matrix:
    name: server installer (${{ matrix.distro }})
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        needs.changes.result == 'success' &&
        needs.changes.outputs.server_install == 'true') ||
       github.event_name == 'release' ||
       (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0') ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.suite == 'install' || inputs.suite == 'artifacts' || inputs.suite == 'all')))
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro:
          - ubuntu24
          - debian12
          - alpine321
          - rocky9
          - fedora44
          - arch
    env:
      ORVA_VERSION: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
      - name: install jq + curl
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq curl
      - name: fetch exact released installer
        if: github.event_name == 'release' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          installer="$RUNNER_TEMP/release-assets/install.sh"
          tag=$(sh test/release/download-verified-asset.sh install.sh "$installer")
          echo "ORVA_VERSION=$tag" >> "$GITHUB_ENV"
          echo "ORVA_INSTALLER_PATH=$installer" >> "$GITHUB_ENV"
      - name: run install + smoke + uninstall
        id: installer
        env:
          ORVA_BROWSER_LEG: "0"
        run: bash test/install/run-distro.sh ${{ matrix.distro }}
      - name: summarize result
        if: always()
        run: |
          result="not recorded"
          if compgen -G 'test/install/results-*.tsv' >/dev/null; then
            recorded=$(awk -F '\t' -v distro="${{ matrix.distro }}" '$1 == distro { value=$2 } END { print value }' test/install/results-*.tsv)
            [ -z "$recorded" ] || result="$recorded"
          fi
          {
            echo "## installer: ${{ matrix.distro }}"
            echo ""
            echo "Result: **$result**"
          } >> "$GITHUB_STEP_SUMMARY"
          install_log="test/install/logs/${{ matrix.distro }}-install.log"
          if [ "${{ steps.installer.outcome }}" = "failure" ] && [ -s "$install_log" ]; then
            {
              echo ""
              echo "<details><summary>installer log tail</summary>"
              echo ""
              echo '```text'
              tail -60 "$install_log"
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
            failure_tail=$(tail -40 "$install_log")
            failure_tail=${failure_tail//'%'/'%25'}
            failure_tail=${failure_tail//$'\r'/'%0D'}
            failure_tail=${failure_tail//$'\n'/'%0A'}
            echo "::error title=${{ matrix.distro }} installer log::$failure_tail"
          fi

  native-engine:
    name: native systemd + Node/Python engine (${{ matrix.arch }})
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        needs.changes.result == 'success' &&
        needs.changes.outputs.server_install == 'true') ||
       github.event_name == 'release' ||
       (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0') ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.suite == 'install' || inputs.suite == 'artifacts' || inputs.suite == 'all')))
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
      - name: install jq
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends jq
      - name: fetch exact released installer
        if: github.event_name == 'release' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          installer="$RUNNER_TEMP/release-assets/install.sh"
          tag=$(sh test/release/download-verified-asset.sh install.sh "$installer")
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "ORVA_INSTALLER_PATH=$installer" >> "$GITHUB_ENV"
      - name: install and invoke both runtimes
        run: sudo --preserve-env=RELEASE_TAG,ORVA_INSTALLER_PATH bash test/install/native-engine.sh

  released-container:
    name: released container (${{ matrix.arch }})
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0') ||
      (github.event_name == 'workflow_dispatch' &&
        (inputs.suite == 'install' || inputs.suite == 'artifacts' || inputs.suite == 'all'))
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      IMAGE: ghcr.io/harsh-2002/orva:latest
      EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: verify manifest and build identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected="$RELEASE_TAG"
          if [ -z "$expected" ]; then
            expected=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          fi
          test -n "$expected"
          commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$expected" --jq .sha)
          short_commit=${commit:0:7}
          test -n "$short_commit"

          case "$EXPECTED_ARCH:$(uname -m)" in
            amd64:x86_64|arm64:aarch64|arm64:arm64) ;;
            *) echo "unexpected runner architecture: $(uname -m) (wanted $EXPECTED_ARCH)" >&2; exit 1 ;;
          esac

          docker manifest inspect "$IMAGE" > "$RUNNER_TEMP/orva-manifest.json"
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' \
            "$RUNNER_TEMP/orva-manifest.json"

          docker pull "$IMAGE"
          label_version=$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')
          label_commit=$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          test "$label_version" = "$expected"
          test "$label_commit" = "$short_commit"

          docker run -d --name orva-released -p 127.0.0.1:18443:8443 "$IMAGE"
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18443/api/v1/system/health > "$RUNNER_TEMP/orva-health.json"; then
              break
            fi
            sleep 1
          done
          jq -e --arg version "$expected" --arg commit "$short_commit" \
            '.version == $version and .commit == $commit' \
            "$RUNNER_TEMP/orva-health.json"
      - name: stop released container
        if: always()
        run: |
          docker logs orva-released 2>&1 || true
          docker rm -f orva-released >/dev/null 2>&1 || true
