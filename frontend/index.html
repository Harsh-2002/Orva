<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orva - Serverless Platform</title>

    <!--
      Theme, resolved before the first paint.

      This has to be inline and it has to be here, above the stylesheet. The
      app bundle is a module script, so it is deferred by definition: waiting
      for it means every load paints night first and then corrects itself, and
      an operator who chose day would see a black flash on every navigation
      into the app.

      Tri-state, mirroring the one persisted UI preference this codebase
      already has (`orva:diff:sideBySide` in FunctionDiff.vue): absent means
      follow the OS, an explicit value overrides it. The attribute written to
      <html> is always concrete ('day' or 'night'), never 'system', so CSS only
      ever has to match one of two states.
    -->
    <script>
      (function () {
        var el = document.documentElement
        var pref = null
        try { pref = localStorage.getItem('orva:theme') } catch (e) { /* private mode */ }
        var system = window.matchMedia
          && window.matchMedia('(prefers-color-scheme: light)').matches
            ? 'day'
            : 'night'
        el.dataset.themePref = pref || 'system'
        el.dataset.theme = pref === 'day' || pref === 'night' ? pref : system
      })()
    </script>

    <!--
      Two media-scoped tags so the browser chrome follows the OS before any
      script has run. The toggle replaces them with a single unscoped tag the
      moment the operator picks a specific theme, because a scoped light tag
      loses to a system-dark phone.
    -->
    <meta name="theme-color" content="#F8F7F4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E0D09" media="(prefers-color-scheme: dark)" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
